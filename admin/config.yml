backend:
  name: git-gateway
  branch: main

media_folder: "wp-content/uploads"
public_folder: "/wp-content/uploads"

collections:
  - name: "tours"
    label: "Tours"
    folder: "tours"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tour Title", name: "title", widget: "string" }
      - { label: "Tour Image", name: "image", widget: "image" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "gallery_data"
    label: "Gallery Images"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "gallery-data.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
