<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery – Tour Kenya Adventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --dark: #0e0e0e;
      --dark-2: #1a1a18;
      --cream: #F5F0E8;
      --text: #2a2a28;
      --muted: #7a7a70;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HERO BANNER ── */
    .hero {
      background: var(--dark);
      color: var(--cream);
      text-align: center;
      padding: 80px 24px 64px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 120%, rgba(201,168,76,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--gold-light);
    }
    .hero-sub {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(245,240,232,0.65);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .hero-line {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 28px auto 0;
    }

    /* ── BACK LINK ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 20px 32px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }
    .back-link svg { width: 14px; height: 14px; }

    /* ── STATUS MESSAGES ── */
    .status {
      text-align: center;
      padding: 80px 24px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .status.error { color: #c0392b; }

    /* ── GALLERY GRID ── */
    .gallery-section {
      padding: 48px 32px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery-count {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (max-width: 1024px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
    @media (max-width: 400px)  { .gallery-grid { grid-template-columns: 1fr; } }

    .gallery-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background: #ddd;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .gallery-item.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .gallery-item:hover img { transform: scale(1.06); }

    .gallery-item-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(14,14,14,0.72) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex; align-items: flex-end;
      padding: 16px;
    }
    .gallery-item:hover .gallery-item-overlay { opacity: 1; }
    .gallery-item-caption {
      color: #fff;
      font-size: 0.82rem;
      font-weight: 300;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    .gallery-zoom-icon {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .gallery-item:hover .gallery-zoom-icon { opacity: 1; }
    .gallery-zoom-icon svg { width: 14px; height: 14px; stroke: #fff; fill: none; }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }
    .empty-state p { font-size: 1rem; line-height: 1.7; }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(10,10,10,0.96);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox.active { opacity: 1; pointer-events: all; }

    .lightbox-inner {
      position: relative;
      max-width: min(90vw, 1100px);
      max-height: 90vh;
      display: flex; flex-direction: column; align-items: center;
    }
    .lightbox-img-wrap {
      position: relative;
      max-height: 78vh;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-img-wrap img {
      max-width: 100%; max-height: 78vh;
      object-fit: contain;
      display: block;
      border-radius: 2px;
    }
    .lightbox-caption {
      color: rgba(245,240,232,0.7);
      font-size: 0.88rem;
      font-weight: 300;
      margin-top: 16px;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .lightbox-close {
      position: fixed; top: 24px; right: 28px;
      background: none; border: none; cursor: pointer;
      color: rgba(245,240,232,0.6);
      font-size: 2rem; line-height: 1;
      transition: color 0.2s;
      z-index: 10000;
    }
    .lightbox-close:hover { color: var(--gold); }

    .lightbox-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff; border-radius: 50%;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s, color 0.2s;
      font-size: 1.2rem;
    }
    .lightbox-nav:hover { background: var(--gold); color: var(--dark); }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    @media (max-width: 600px) {
      .lightbox-prev { left: 8px; }
      .lightbox-next { right: 8px; }
    }

    .lightbox-counter {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(245,240,232,0.4);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
    }

    /* ── FOOTER ── */
    .gallery-footer {
      background: var(--dark-2);
      color: rgba(245,240,232,0.4);
      text-align: center;
      padding: 32px 24px;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }
    .gallery-footer a { color: var(--gold); text-decoration: none; }
    .gallery-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <p class="hero-eyebrow">Tour Kenya Adventures</p>
  <h1>Our <em>Gallery</em></h1>
  <p class="hero-sub">Moments captured across Kenya's most breathtaking landscapes and wildlife encounters.</p>
  <div class="hero-line"></div>
</div>

<a href="../index.html" class="back-link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  Back to Home
</a>

<!-- GALLERY -->
<section class="gallery-section">
  <p class="gallery-count" id="gallery-count"></p>
  <div class="gallery-grid" id="gallery-grid">
    <div class="status" id="loading-msg">Loading gallery…</div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-label="Image lightbox">
  <button class="lightbox-close" id="lb-close" aria-label="Close">&#215;</button>
  <button class="lightbox-nav lightbox-prev" id="lb-prev" aria-label="Previous">&#8592;</button>
  <button class="lightbox-nav lightbox-next" id="lb-next" aria-label="Next">&#8594;</button>
  <div class="lightbox-inner">
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="" />
    </div>
    <p class="lightbox-caption" id="lb-caption"></p>
  </div>
  <div class="lightbox-counter" id="lb-counter"></div>
</div>

<!-- FOOTER -->
<footer class="gallery-footer">
  &copy; 2025 Tour Kenya Adventures &nbsp;|&nbsp;
  <a href="../contact/index.html">Contact Us</a>
</footer>

<script>
(async function () {
  const grid = document.getElementById('gallery-grid');
  const countEl = document.getElementById('gallery-count');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCaption = document.getElementById('lb-caption');
  const lbCounter = document.getElementById('lb-counter');

  let images = [];
  let current = 0;

  // ── LOAD DATA ──────────────────────────────────────────────
  async function loadGallery() {
    try {
      const res = await fetch('/gallery-data.json');
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      images = data.images || [];
    } catch (e) {
      // Fallback: try to fetch from the same folder
      try {
        const res2 = await fetch('gallery-data.json');
        if (!res2.ok) throw new Error('Not found');
        const data2 = await res2.json();
        images = data2.images || [];
      } catch (e2) {
        images = [];
      }
    }
    renderGallery();
  }

  // ── RENDER ────────────────────────────────────────────────
  function renderGallery() {
    grid.innerHTML = '';

    if (images.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <p>No gallery images yet.<br>Add images through the <a href="/admin/" style="color:var(--gold)">admin panel</a>.</p>
        </div>`;
      countEl.textContent = '';
      return;
    }

    countEl.textContent = `${images.length} photograph${images.length !== 1 ? 's' : ''}`;

    images.forEach((item, idx) => {
      const el = document.createElement('div');
      el.className = 'gallery-item';
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', item.caption || `Image ${idx + 1}`);
      el.innerHTML = `
        <img src="${item.image}" alt="${item.caption || ''}" loading="lazy" />
        <div class="gallery-item-overlay">
          <span class="gallery-item-caption">${item.caption || ''}</span>
        </div>
        <div class="gallery-zoom-icon">
          <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </div>`;
      el.addEventListener('click', () => openLightbox(idx));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(idx); });
      grid.appendChild(el);

      // Stagger reveal animation
      setTimeout(() => el.classList.add('visible'), idx * 60);
    });
  }

  // ── LIGHTBOX ──────────────────────────────────────────────
  function openLightbox(idx) {
    current = idx;
    updateLightbox();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  function updateLightbox() {
    const item = images[current];
    lbImg.src = item.image;
    lbImg.alt = item.caption || '';
    lbCaption.textContent = item.caption || '';
    lbCounter.textContent = `${current + 1} / ${images.length}`;
  }

  function prevImage() { current = (current - 1 + images.length) % images.length; updateLightbox(); }
  function nextImage() { current = (current + 1) % images.length; updateLightbox(); }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', prevImage);
  document.getElementById('lb-next').addEventListener('click', nextImage);

  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

  await loadGallery();
})();
</script>
</body>
</html>
